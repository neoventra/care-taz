# Caretaz Healthcare — Netlify (Git-connected static site)
[build]
  publish = "."
  command = "exit 0"

[build.environment]
  NODE_VERSION = "20"

# Pretty URLs: clean path ↔ .html file
# 200 = rewrite (URL stays clean). 301 + force = canonicalize away from .html

[[redirects]]
  from = "/about-us"
  to = "/about-us.html"
  status = 200
[[redirects]]
  from = "/about-us/"
  to = "/about-us.html"
  status = 200
[[redirects]]
  from = "/about-us.html"
  to = "/about-us"
  status = 301
  force = true

